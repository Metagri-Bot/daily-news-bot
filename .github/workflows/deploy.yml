name: Deploy Daily News Bot

on:
  push:
    branches: [ "main" ] # mainブランチにプッシュされたときに実行
  workflow_dispatch: # 手動でも実行できるようにする
    inputs:
      send_farm_partner_once:
        description: '農家・食品パートナー案件を今すぐ1回収集・配信（履歴で重複抑止）'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. SSH接続をセットアップ
      - name: Setup SSH
        uses: MrSquaare/ssh-setup-action@v2.0.1
        with:
          host: ${{ secrets.SSH_HOST }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. サーバーで使う .env ファイルをSecretsから生成する
      - name: Write .env file
        run: |
          echo "DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}" >> .env
          echo "DISABLE_DAILY_NEWS=true" >> .env
          echo "NEWS_CHANNEL_ID=${{ secrets.NEWS_CHANNEL_ID }}" >> .env
          echo "GOOGLE_APPS_SCRIPT_URL=${{ secrets.GOOGLE_APPS_SCRIPT_URL }}" >> .env
          echo "BIGNER_ROLE_ID=${{ secrets.BIGNER_ROLE_ID }}" >> .env
          echo "METAGRI_ROLE_ID=${{ secrets.METAGRI_ROLE_ID }}" >> .env
          echo "NEWS_RSS_FEEDS_AGRICULTURE=${{ secrets.NEWS_RSS_FEEDS_AGRICULTURE }}" >> .env
          echo "NEWS_RSS_FEEDS_WEB3=${{ secrets.NEWS_RSS_FEEDS_WEB3 }}" >> .env
          echo "INFO_GATHERING_CHANNEL_ID=${{ secrets.INFO_GATHERING_CHANNEL_ID }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env          
          echo "GLOBAL_RESEARCH_CHANNEL_ID=${{ secrets.GLOBAL_RESEARCH_CHANNEL_ID }}" >> .env
          echo "GLOBAL_RSS_FEEDS=${{ secrets.GLOBAL_RSS_FEEDS }}" >> .env
          echo "ROBLOX_NEWS_CHANNEL_ID=${{ secrets.ROBLOX_NEWS_CHANNEL_ID }}" >> .env
          echo "ROBLOX_RSS_FEEDS=${{ secrets.ROBLOX_RSS_FEEDS }}" >> .env     
          echo "NEW_BOOK_CHANNEL_ID=${{ secrets.NEW_BOOK_CHANNEL_ID }}" >> .env     
          echo "RAKUTEN_APP_ID=${{ secrets.RAKUTEN_APP_ID }}" >> .env     
          echo "POPULAR_BOOK_CHANNEL_ID=${{ secrets.POPULAR_BOOK_CHANNEL_ID }}" >> .env
          echo "AI_GUIDE_GAS_URL=${{ secrets.AI_GUIDE_GAS_URL }}" >> .env
          echo "MONITORING_WEBHOOK_URL=${{ secrets.MONITORING_WEBHOOK_URL }}" >> .env
          # 公募モニター（各Secretが空でもコード側の既定値が使われる）
          # 既定値: 投稿先=NEWS_CHANNEL_ID / 平日7:30 / 65点以上 / 優先度3まで / gpt-5.6-luna
          echo "PUBLIC_OPPORTUNITY_CHANNEL_ID=${{ secrets.PUBLIC_OPPORTUNITY_CHANNEL_ID }}" >> .env
          echo "DISABLE_PUBLIC_OPPORTUNITY=${{ secrets.DISABLE_PUBLIC_OPPORTUNITY }}" >> .env
          echo "PUBLIC_OPPORTUNITY_OPENAI_MODEL=${{ secrets.PUBLIC_OPPORTUNITY_OPENAI_MODEL }}" >> .env
          echo "PUBLIC_OPPORTUNITY_CRON=${{ secrets.PUBLIC_OPPORTUNITY_CRON }}" >> .env
          echo "PUBLIC_OPPORTUNITY_MIN_SCORE=${{ secrets.PUBLIC_OPPORTUNITY_MIN_SCORE }}" >> .env
          echo "PUBLIC_OPPORTUNITY_MAX_PRIORITY=${{ secrets.PUBLIC_OPPORTUNITY_MAX_PRIORITY }}" >> .env
          echo "CHIBA_TENDER_CHANNEL_ID=${{ secrets.CHIBA_TENDER_CHANNEL_ID }}" >> .env
          echo "DISABLE_CHIBA_TENDER=${{ secrets.DISABLE_CHIBA_TENDER }}" >> .env
          echo "CHIBA_TENDER_CRON=${{ secrets.CHIBA_TENDER_CRON }}" >> .env
          echo "CHIBA_TENDER_MIN_SCORE=${{ secrets.CHIBA_TENDER_MIN_SCORE }}" >> .env
          echo "CHIBA_TENDER_ALERT_SCORE=${{ secrets.CHIBA_TENDER_ALERT_SCORE }}" >> .env
          echo "CHIBA_TENDER_MAX_PRIORITY=${{ secrets.CHIBA_TENDER_MAX_PRIORITY }}" >> .env
          echo "FARM_PARTNER_CHANNEL_ID=${{ secrets.FARM_PARTNER_CHANNEL_ID }}" >> .env
          echo "FARM_PARTNER_CRON=${{ secrets.FARM_PARTNER_CRON }}" >> .env
          echo "FARM_PARTNER_MIN_SCORE=${{ secrets.FARM_PARTNER_MIN_SCORE }}" >> .env
          echo "DISABLE_FARM_PARTNER_RADAR=${{ secrets.DISABLE_FARM_PARTNER_RADAR }}" >> .env
          # Discordチャンネル投稿ログ（日次バッチ・2026-09-18 追加）
          # 既定値: 毎日5:10 JST / Botの投稿も含む / 初回は7日さかのぼり / 1回あたり1000件
          # DISCORD_CHANNEL_LOG_CHANNEL_IDS が空のときはジョブ自体を登録しない（誤作動しない側へ倒す）
          echo "DISCORD_CHANNEL_LOG_CHANNEL_IDS=${{ secrets.DISCORD_CHANNEL_LOG_CHANNEL_IDS }}" >> .env
          echo "DISCORD_CHANNEL_LOG_GAS_URL=${{ secrets.DISCORD_CHANNEL_LOG_GAS_URL }}" >> .env
          echo "DISCORD_CHANNEL_LOG_CRON=${{ secrets.DISCORD_CHANNEL_LOG_CRON }}" >> .env
          echo "DISCORD_CHANNEL_LOG_INCLUDE_BOTS=${{ secrets.DISCORD_CHANNEL_LOG_INCLUDE_BOTS }}" >> .env
          echo "DISCORD_CHANNEL_LOG_INITIAL_LOOKBACK_DAYS=${{ secrets.DISCORD_CHANNEL_LOG_INITIAL_LOOKBACK_DAYS }}" >> .env
          echo "DISCORD_CHANNEL_LOG_MAX_PER_RUN=${{ secrets.DISCORD_CHANNEL_LOG_MAX_PER_RUN }}" >> .env
          echo "DISABLE_DISCORD_CHANNEL_LOG=${{ secrets.DISABLE_DISCORD_CHANNEL_LOG }}" >> .env
          # 日誌素案（週次・既定 毎週木曜6:00 JST / 前日ぶんの生ログをそのまま投稿）
          # DIARY_DRAFT_CHANNEL_ID が空のときはジョブ自体を登録しない
          # 収集対象は未設定なら DISCORD_CHANNEL_LOG_CHANNEL_IDS を流用する
          echo "DIARY_DRAFT_CHANNEL_ID=${{ secrets.DIARY_DRAFT_CHANNEL_ID }}" >> .env
          echo "DIARY_DRAFT_CRON=${{ secrets.DIARY_DRAFT_CRON }}" >> .env
          echo "DIARY_DRAFT_OFFSET_DAYS=${{ secrets.DIARY_DRAFT_OFFSET_DAYS }}" >> .env
          echo "DIARY_DRAFT_SOURCE_CHANNEL_IDS=${{ secrets.DIARY_DRAFT_SOURCE_CHANNEL_IDS }}" >> .env
          echo "DISABLE_DIARY_DRAFT=${{ secrets.DISABLE_DIARY_DRAFT }}" >> .env
          # 4. SSH経由でサーバーにDocker Composeコマンドを送信してデプロイ
      - name: Deploy with Docker Compose
        run: docker compose up --build -d
        env:
          DOCKER_HOST: 'ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}'

      - name: Send farm partner opportunities once
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_farm_partner_once }}
        run: docker compose exec -T app node scripts/farm-partner-radar.js --send
        env:
          DOCKER_HOST: 'ssh://${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}'
